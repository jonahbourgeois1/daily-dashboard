const KEY="dd-key-v1";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(P.salt),iterations:P.iter},base,256));
}
async function dec(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},k,b64(P.ct)));
}
function show(html){const go=()=>{document.open();document.write(html);document.close();};if(document.readyState==="complete")go();else addEventListener("load",go,{once:true});}
// "Remember" stores the derived key for this build's salt; after each daily rebuild the password is asked once again.
(async()=>{
  try{const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&s.salt===P.salt){show(await dec(b64(s.key)));return;}}catch(e){localStorage.removeItem(KEY);}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;err.textContent="Unlocking...";
  try{const raw=await derive(document.getElementById("pw").value);const html=await dec(raw);
    if(document.getElementById("rem").checked){localStorage.setItem(KEY,JSON.stringify({salt:P.salt,key:btoa(String.fromCharCode(...raw))}));}
    show(html);
  }catch(x){err.textContent="Wrong password. Try again.";btn.disabled=false;}
});
</script></body></html>
